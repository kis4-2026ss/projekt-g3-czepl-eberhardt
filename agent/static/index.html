<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directus AI Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9f7f4;
      color: #1a1816;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #1a1816;
      color: #fff;
      padding: .9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left h1 { font-size: .95rem; font-weight: 700; }
    .header-left .sub { font-size: .72rem; color: #9ca3af; margin-top: 1px; }
    .btn-new {
      background: transparent;
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: .35rem .85rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
    }
    .btn-new:hover { background: rgba(255,255,255,.1); }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }

    /* ── Empty state ── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      flex: 1;
      color: #6b7280;
      text-align: center;
    }
    #empty-state h2 { font-size: 1.05rem; color: #1a1816; font-weight: 700; }
    #empty-state p { font-size: .82rem; max-width: 340px; }

    /* ── Message rows ── */
    .msg { display: flex; flex-direction: column; max-width: 800px; width: 100%; }
    .msg-user { align-self: flex-end; align-items: flex-end; }
    .msg-ai   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: .7rem 1rem;
      border-radius: 10px;
      font-size: .875rem;
      line-height: 1.65;
      max-width: 100%;
    }
    .bubble-user {
      background: #1a1816;
      color: #f9f7f4;
      border-radius: 10px 10px 3px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-ai {
      background: #fff;
      border: 1px solid #e5e1da;
      border-radius: 10px 10px 10px 3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    /* Markdown inside AI bubble */
    .bubble-ai p { margin-bottom: .55rem; }
    .bubble-ai p:last-child { margin-bottom: 0; }
    .bubble-ai ul, .bubble-ai ol { padding-left: 1.2rem; margin-bottom: .55rem; }
    .bubble-ai li { margin-bottom: .2rem; }
    .bubble-ai h1,.bubble-ai h2,.bubble-ai h3 { font-weight: 700; margin: .5rem 0 .3rem; }
    .bubble-ai code {
      background: #f3f1ec;
      padding: .1rem .35rem;
      border-radius: 3px;
      font-size: .82em;
      font-family: 'Menlo', 'Consolas', monospace;
    }
    .bubble-ai pre {
      background: #1a1816;
      color: #f9f7f4;
      padding: .75rem 1rem;
      border-radius: 5px;
      overflow-x: auto;
      margin: .5rem 0;
      font-size: .8rem;
    }
    .bubble-ai pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
    .bubble-ai strong { font-weight: 700; }
    .bubble-ai a { color: #2563eb; text-underline-offset: 2px; }
    .bubble-ai blockquote {
      border-left: 3px solid #e5e1da;
      padding-left: .75rem;
      color: #6b7280;
      margin: .4rem 0;
    }

    /* ── Tool indicators (appear above the bubble in the AI msg wrapper) ── */
    .tools-row {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-bottom: .4rem;
    }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-size: .7rem;
      font-weight: 700;
      background: #fef9c3;
      color: #92400e;
      border: 1px solid #fde68a;
      white-space: nowrap;
    }
    .tool-badge.done {
      background: #dcfce7;
      color: #16a34a;
      border-color: #bbf7d0;
    }
    .tool-badge .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .tool-badge:not(.done) .dot { animation: blink 1.1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .typing { color: #9ca3af; font-style: italic; font-size: .82rem; }

    /* ── Error bubble ── */
    .bubble-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: .65rem .9rem;
      font-size: .82rem;
    }

    /* ── Input area ── */
    #input-area {
      background: #fff;
      border-top: 1px solid #e5e1da;
      padding: .9rem 1.25rem;
      display: flex;
      gap: .65rem;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      padding: .65rem .9rem;
      border: 1px solid #d1cdc7;
      border-radius: 6px;
      font-size: .875rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 42px;
      max-height: 180px;
      overflow-y: auto;
      background: #f9f7f4;
      transition: border-color .15s;
    }
    #msg-input:focus { border-color: #1a1816; background: #fff; }
    #msg-input::placeholder { color: #9ca3af; }
    #send-btn {
      background: #1a1816;
      color: #fff;
      border: none;
      padding: 0 1.1rem;
      height: 42px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: .85rem;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover:not(:disabled) { background: #374151; }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Directus AI Agent</h1>
    <div class="sub">Gemini · MCP · LangChain</div>
  </div>
  <button class="btn-new" onclick="newChat()">+ Neuer Chat</button>
</header>

<div id="messages">
  <div id="empty-state">
    <h2>Wie kann ich helfen?</h2>
    <p>Frag mich nach CMS-Inhalten oder bitte mich, Änderungen vorzubereiten.</p>
  </div>
</div>

<div id="input-area">
  <textarea
    id="msg-input"
    placeholder="Nachricht eingeben… (Enter senden · Shift+Enter neue Zeile)"
    rows="1"
  ></textarea>
  <button id="send-btn" onclick="sendMessage()">Senden</button>
</div>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  let sessionId  = crypto.randomUUID();
  let streaming  = false;

  const msgList  = document.getElementById('messages');
  const input    = document.getElementById('msg-input');
  const sendBtn  = document.getElementById('send-btn');
  const empty    = document.getElementById('empty-state');

  /* ── Session ── */
  function newChat() {
    sessionId = crypto.randomUUID();
    msgList.innerHTML = '';
    msgList.appendChild(empty);
    empty.style.display = '';
    input.focus();
  }

  /* ── Scroll ── */
  function scrollBottom() {
    msgList.scrollTop = msgList.scrollHeight;
  }

  /* ── Append user message ── */
  function appendUser(text) {
    empty.remove();
    const row = document.createElement('div');
    row.className = 'msg msg-user';
    const bub = document.createElement('div');
    bub.className = 'bubble bubble-user';
    bub.textContent = text;
    row.appendChild(bub);
    msgList.appendChild(row);
    scrollBottom();
  }

  /* ── Create AI message shell ── */
  function createAiRow() {
    empty.remove();
    const row    = document.createElement('div');
    row.className = 'msg msg-ai';

    const tools  = document.createElement('div');
    tools.className = 'tools-row';

    const bub    = document.createElement('div');
    bub.className = 'bubble bubble-ai';
    bub.innerHTML = '<span class="typing">Denke nach…</span>';

    row.appendChild(tools);
    row.appendChild(bub);
    msgList.appendChild(row);
    scrollBottom();
    return { row, tools, bub };
  }

  /* ── Tool badges ── */
  const activeBadges = {};

  function toolStart(toolsEl, name) {
    const badge = document.createElement('span');
    badge.className = 'tool-badge';
    badge.innerHTML = `<span class="dot"></span>${name}`;
    toolsEl.appendChild(badge);
    activeBadges[name] = badge;
    scrollBottom();
  }

  function toolDone(name) {
    const b = activeBadges[name];
    if (!b) return;
    b.classList.add('done');
    b.innerHTML = `<span class="dot"></span>${name} ✓`;
  }

  /* ── Send ── */
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    // Clear badge state from previous turn
    for (const k of Object.keys(activeBadges)) delete activeBadges[k];

    appendUser(text);
    const { tools: toolsEl, bub } = createAiRow();

    let rawContent = '';
    let started    = false;

    try {
      const resp = await fetch('/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!resp.ok) throw new Error(`Server error ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buf     = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          switch (event.type) {
            case 'token':
              if (!started) { bub.innerHTML = ''; started = true; }
              rawContent += event.content;
              bub.innerHTML = marked.parse(rawContent);
              scrollBottom();
              break;
            case 'tool_start':
              toolStart(toolsEl, event.name);
              break;
            case 'tool_end':
              toolDone(event.name);
              break;
            case 'error':
              bub.innerHTML = '';
              const errDiv = document.createElement('div');
              errDiv.className = 'bubble-error';
              errDiv.textContent = `Fehler: ${event.content}`;
              bub.replaceWith(errDiv);
              break;
            case 'done':
              if (!started) bub.innerHTML = '<em style="color:#9ca3af">Keine Antwort.</em>';
              break;
          }
        }
      }
    } catch (err) {
      bub.innerHTML = '';
      const errDiv = document.createElement('div');
      errDiv.className = 'bubble-error';
      errDiv.textContent = `Verbindungsfehler: ${err.message}`;
      bub.replaceWith(errDiv);
    } finally {
      streaming = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  /* ── Textarea auto-resize ── */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  });

  /* ── Enter to send ── */
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.focus();
</script>
</body>
</html>
