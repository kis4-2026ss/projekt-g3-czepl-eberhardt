</div>

<!-- ─── Confirm dialog ──────────────────────────────────────────────── -->
<div id="confirm-overlay" class="overlay" onclick="onOverlayClick(event,'confirm-overlay')">
  <div class="modal confirm-modal">
    <div class="modal-head">
      <h2 id="confirm-title">Bestätigen</h2>
      <button class="btn-close" onclick="closeConfirm()" aria-label="Schließen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="confirm-body"><p id="confirm-msg"></p></div>
    <div class="confirm-foot">
      <button class="btn-ghost" onclick="closeConfirm()">Abbrechen</button>
      <button class="btn-primary" id="confirm-ok">Bestätigen</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  // ── Constants ────────────────────────────────────────────────────────
  const AVATAR_COLORS = ['#7c3aed','#0369a1','#0f766e','#b45309','#be185d','#16a34a','#dc2626'];
  const SUGGESTIONS = [
    { title: 'Collections auflisten', desc: 'Welche Datenmodelle existieren?', icon: 'layers',
      prompt: 'Liste mir alle Collections und ihre wichtigsten Felder auf.' },
    { title: 'Inhalte zusammenfassen', desc: 'Überblick über die Website',     icon: 'doc',
      prompt: 'Gib mir einen Überblick über die aktuellen Inhalte der Website.' },
    { title: 'Neuen Eintrag anlegen',   desc: 'Strukturiert erstellen',         icon: 'plus',
      prompt: 'Hilf mir, einen neuen Eintrag anzulegen. Frage nach den Details.' },
    { title: 'Letzte Änderungen',       desc: 'Was wurde kürzlich aktualisiert?', icon: 'clock',
      prompt: 'Zeige mir die zuletzt geänderten Einträge.' },
  ];

  const ICONS = {
    layers: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l8 4-8 4-8-4 8-4z"/><path d="M3 11l8 4 8-4"/><path d="M3 15l8 4 8-4"/></svg>',
    doc:    '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-4-4z"/><path d="M14 3v4h4"/><path d="M7 11h8M7 14h8M7 8h2"/></svg>',
    plus:   '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M11 7v8M7 11h8"/></svg>',
    clock:  '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M11 6v5l3 2"/></svg>',
  };

  const AI_AVATAR_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.4 3.2L12.8 6 10 8l-.8 3.5L8 9.5 6.8 11.5 6 8 3.2 6l3.4-.8L8 2z"/></svg>';

  // ── State ────────────────────────────────────────────────────────────
  let sessionId   = crypto.randomUUID();
  let streaming   = false;
  let activeInst  = null;
  let instances   = [];
  let editingId   = null;
  let allowClose  = false;
  let currentReader = null;
  let chats       = {};        // { instanceId: [ {id, title, messages, updatedAt} ] }
  let currentChatId = null;
  let autoScroll  = true;

  function avatarColor(id) { return AVATAR_COLORS[((id || 0) - 1 + AVATAR_COLORS.length) % AVATAR_COLORS.length]; }
  function initials(name)  { return (name || '?').trim().slice(0, 2).toUpperCase(); }
  function esc(s)          { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function nowStr() {
    const d = new Date();
    return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtRelative(ts) {
    const diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'gerade eben';
    if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
    if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
    if (diff < 604800) return `vor ${Math.floor(diff/86400)} T`;
    return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
  }

  const msgList  = document.getElementById('messages');
  const msgRegion = document.getElementById('messages-region');
  const input    = document.getElementById('msg-input');
  const sendBtn  = document.getElementById('send-btn');
  const sendIcon = document.getElementById('send-icon');
  const composer = document.getElementById('composer');

  // ── Theme ────────────────────────────────────────────────────────────
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    document.getElementById('theme-icon').innerHTML = t === 'dark'
      ? '<path d="M13 8.5A5.5 5.5 0 0 1 7.5 3a5 5 0 0 0-1 9.83A5.5 5.5 0 0 0 13 8.5z"/>'
      : '<circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M3.04 3.04l1.06 1.06M11.9 11.9l1.06 1.06M1 8h1.5M13.5 8H15M3.04 12.96l1.06-1.06M11.9 4.1l1.06-1.06"/>';
    document.getElementById('theme-icon').setAttribute('stroke-linecap','round');
    document.getElementById('theme-icon').setAttribute('stroke-linejoin','round');
  }
  function toggleTheme() {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('atelier:theme', next); } catch {}
  }
  try {
    const saved = localStorage.getItem('atelier:theme');
    applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch { applyTheme('light'); }

  // ── Sidebar toggle ───────────────────────────────────────────────────
  function toggleSidebar() {
    const app = document.getElementById('app');
    if (window.innerWidth <= 840) {
      app.classList.toggle('sidebar-open');
    } else {
      app.classList.toggle('sidebar-collapsed');
      try { localStorage.setItem('atelier:sidebar', app.classList.contains('sidebar-collapsed') ? '0' : '1'); } catch {}
    }
  }
  try {
    if (localStorage.getItem('atelier:sidebar') === '0' && window.innerWidth > 840) {
      document.getElementById('app').classList.add('sidebar-collapsed');
    }
  } catch {}

  // ── Toasts ───────────────────────────────────────────────────────────
  function toast(msg, kind = '') {
    const w = document.getElementById('toast-wrap');
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${kind==='err' ? '<circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11h0"/>' : '<path d="M3 8.5l3.5 3.5L13 5"/>'}</svg><span>${esc(msg)}</span>`;
    w.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity 200ms, transform 200ms';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 220);
    }, 2400);
  }

  // ── Confirm dialog ───────────────────────────────────────────────────
  let confirmResolve = null;
  function confirmAsk(title, msg, okLabel = 'Bestätigen', danger = false) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    const ok = document.getElementById('confirm-ok');
    ok.textContent = okLabel;
    ok.className = danger ? 'btn-primary' : 'btn-primary';
    if (danger) { ok.style.background = 'var(--err)'; }
    else { ok.style.background = ''; }
    document.getElementById('confirm-overlay').classList.add('open');
    return new Promise(res => { confirmResolve = res; });
  }
  function closeConfirm(val = false) {
    document.getElementById('confirm-overlay').classList.remove('open');
    if (confirmResolve) { confirmResolve(val); confirmResolve = null; }
  }
  document.getElementById('confirm-ok').addEventListener('click', () => closeConfirm(true));

  // ── Instances API ────────────────────────────────────────────────────
  async function loadInstances() {
    try {
      const r = await fetch('/instances');
      instances = await r.json();
    } catch (e) { instances = []; toast('Instanzen konnten nicht geladen werden.', 'err'); }
    renderGrid();
    renderList();
  }

  function renderGrid() {
    const grid = document.getElementById('inst-grid');
    if (!instances.length) {
      grid.innerHTML = `<div class="empty-inst">Noch keine Instanzen angelegt.<br><a onclick="openSettings()">Jetzt erste Instanz erstellen →</a></div>`;
      return;
    }
    grid.innerHTML = instances.map(i => `
      <div class="inst-card" onclick="pickInstance(${i.id})">
        <div class="avatar" style="background:${avatarColor(i.id)}">${initials(i.name)}</div>
        <div class="ic-name">${esc(i.name)}</div>
        <div class="ic-url">${esc(i.website_url || i.directus_url || '—')}</div>
        <svg class="ic-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l6-6M6 5h5v5"/></svg>
      </div>`).join('');
  }

  function renderList() {
    const list = document.getElementById('inst-list');
    if (!instances.length) {
      list.innerHTML = `<div style="padding:1rem .25rem;color:var(--ink-4);font-size:13px;font-style:italic;font-family:var(--font-display)">Noch keine Instanzen angelegt.</div>`;
      return;
    }
    list.innerHTML = instances.map(i => `
      <div class="settings-card">
        <div class="avatar" style="background:${avatarColor(i.id)}">${initials(i.name)}</div>
        <div class="sc-info">
          <div class="sc-name">${esc(i.name)}</div>
          <div class="sc-meta">${esc(i.website_url || i.directus_url || '—')}</div>
        </div>
        <div class="card-btns">
          <button class="btn-sm" onclick="showForm(${i.id})">Bearbeiten</button>
          <button class="btn-sm danger" onclick="deleteInst(${i.id})">Löschen</button>
        </div>
      </div>`).join('');
  }

  function updateChip() {
    const pill = document.getElementById('instance-pill');
    const avatar = document.getElementById('ip-avatar');
    const name = document.getElementById('ip-name');
    const meta = document.getElementById('ip-meta');
    const ctxDot = document.getElementById('ctx-dot').querySelector('.d');
    const ctxText = document.getElementById('ctx-text');
    const crumb = document.querySelector('#topbar-title .crumb-inst');

    if (activeInst) {
      pill.classList.remove('empty');
      avatar.textContent = initials(activeInst.name);
      avatar.style.background = avatarColor(activeInst.id);
      name.textContent = activeInst.name;
      meta.textContent = activeInst.website_url || activeInst.directus_url || '—';
      ctxDot.classList.remove('off');
      ctxText.textContent = activeInst.name;
      if (crumb) crumb.textContent = activeInst.name;
    } else {
      pill.classList.add('empty');
      avatar.textContent = '?';
      avatar.style.background = '';
      name.textContent = 'Instanz wählen';
      meta.textContent = 'Nichts ausgewählt';
      ctxDot.classList.add('off');
      ctxText.textContent = 'Keine Instanz';
      if (crumb) crumb.textContent = '—';
    }
  }

  // ── Chats persistence ────────────────────────────────────────────────
  function loadChats() {
    try { chats = JSON.parse(localStorage.getItem('atelier:chats') || '{}'); }
    catch { chats = {}; }
  }
  function saveChats() {
    try { localStorage.setItem('atelier:chats', JSON.stringify(chats)); } catch {}
  }
  function chatsForActive() {
    if (!activeInst) return [];
    return (chats[activeInst.id] || []).slice().sort((a,b) => b.updatedAt - a.updatedAt);
  }
  function persistCurrentChat(messages, autoTitle) {
    if (!activeInst || !currentChatId) return;
    const list = chats[activeInst.id] || (chats[activeInst.id] = []);
    let entry = list.find(c => c.id === currentChatId);
    if (!entry) {
      entry = { id: currentChatId, title: autoTitle || 'Neuer Chat', messages: [], updatedAt: Date.now() };
      list.push(entry);
    }
    entry.messages = messages;
    entry.updatedAt = Date.now();
    if (autoTitle && (!entry.title || entry.title === 'Neuer Chat')) entry.title = autoTitle;
    saveChats();
    renderHistory();
  }
  function deleteChat(id) {
    if (!activeInst) return;
    chats[activeInst.id] = (chats[activeInst.id] || []).filter(c => c.id !== id);
    saveChats();
    if (currentChatId === id) newChat();
    renderHistory();
  }
  function renderHistory() {
    const list = document.getElementById('history-list');
    const items = chatsForActive();
    if (!items.length) {
      list.innerHTML = `<div class="history-empty">${activeInst ? 'Noch keine Chats. Stelle deine erste Frage.' : 'Wähle eine Instanz.'}</div>`;
      return;
    }
    list.innerHTML = items.map(c => `
      <div class="history-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat('${c.id}')">
        <span class="h-title">${esc(c.title)}</span>
        <button class="h-del" onclick="event.stopPropagation();deleteChat('${c.id}')" aria-label="Löschen" title="Chat löschen">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>`).join('');
  }

  // ── Start-chat modal ─────────────────────────────────────────────────
  function openStart(switchMode) {
    allowClose = switchMode && !!activeInst;
    document.getElementById('start-close-btn').style.display = allowClose ? '' : 'none';
    renderGrid();
    document.getElementById('start-overlay').classList.add('open');
  }
  function closeStart() {
    if (!allowClose && !activeInst) return;
    document.getElementById('start-overlay').classList.remove('open');
  }
  function pickInstance(id) {
    const inst = instances.find(i => i.id === id);
    if (!inst) return;
    const changed = !activeInst || activeInst.id !== inst.id;
    activeInst = inst;
    updateChip();
    allowClose = true;
    closeStart();
    document.getElementById('app').classList.remove('sidebar-open');
    if (changed) newChat();
    renderHistory();
  }

  // ── Welcome screen ───────────────────────────────────────────────────
  function renderWelcome() {
    msgList.innerHTML = '';
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    const name = activeInst ? esc(activeInst.name) : 'dein Workspace';
    welcome.innerHTML = `
      <div class="welcome-eyebrow"><span class="line"></span><span class="dot"></span>Atelier · AI Agent</div>
      <h1 class="welcome-h1">Was möchtest du heute<br>in <em>${name}</em> tun?</h1>
      <div class="welcome-sub">Stelle Fragen zu deinen Inhalten, verwalte Einträge, oder lasse den Agent komplexe Aufgaben über mehrere Schritte ausführen.</div>
      <div class="suggestions">
        ${SUGGESTIONS.map(s => `
          <button class="sugg-card" onclick="useSuggestion(${JSON.stringify(s.prompt).replace(/"/g,'&quot;')})">
            <div class="sc-icon">${ICONS[s.icon]}</div>
            <div class="sc-title">${s.title}</div>
            <div class="sc-desc">${s.desc}</div>
          </button>`).join('')}
      </div>
    `;
    msgList.appendChild(welcome);
  }
  function useSuggestion(text) {
    if (!activeInst) return;
    input.value = text;
    input.dispatchEvent(new Event('input'));
    input.focus();
  }

  // ── Chat ────────────────────────────────────────────────────────────
  function newChat() {
    if (streaming) abortStream();
    sessionId = crypto.randomUUID();
    currentChatId = crypto.randomUUID();
    msgList.innerHTML = '';
    if (activeInst) {
      input.disabled = false;
      sendBtn.disabled = false;
      composer.classList.remove('disabled');
      renderWelcome();
      input.focus();
    } else {
      input.disabled = true;
      sendBtn.disabled = true;
      composer.classList.add('disabled');
    }
    renderHistory();
    document.getElementById('app').classList.remove('sidebar-open');
  }

  function loadChat(id) {
    if (!activeInst) return;
    if (streaming) abortStream();
    const entry = (chats[activeInst.id] || []).find(c => c.id === id);
    if (!entry) return;
    currentChatId = id;
    sessionId = crypto.randomUUID(); // new server session; warn lightly
    msgList.innerHTML = '';
    for (const m of entry.messages) {
      if (m.role === 'user') appendUser(m.content, false);
      else appendAiStatic(m.content, m.tools || []);
    }
    renderHistory();
    document.getElementById('app').classList.remove('sidebar-open');
    setTimeout(() => msgRegion.scrollTop = msgRegion.scrollHeight, 0);
  }

  function nearBottom() {
    const t = msgRegion.scrollTop;
    const h = msgRegion.scrollHeight - msgRegion.clientHeight;
    return h - t < 80;
  }
  msgRegion.addEventListener('scroll', () => { autoScroll = nearBottom(); });
  function scrollBottomIfNeeded() {
    if (autoScroll) msgRegion.scrollTop = msgRegion.scrollHeight;
  }

  function ensureNoWelcome() {
    const w = msgList.querySelector('.welcome');
    if (w) w.remove();
  }

  function appendUser(text, animate = true) {
    ensureNoWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row msg-user';
    if (!animate) row.style.animation = 'none';
    row.innerHTML = `
      <div class="msg-avatar user">Du</div>
      <div class="msg-body">
        <div class="msg-head"><span class="author">Du</span><span class="time">${nowStr()}</span></div>
        <div class="msg-content"></div>
      </div>`;
    row.querySelector('.msg-content').textContent = text;
    msgList.appendChild(row);
    autoScroll = true;
    scrollBottomIfNeeded();
  }

  function appendAiStatic(html, toolBadges = []) {
    ensureNoWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row msg-ai';
    row.innerHTML = `
      <div class="msg-avatar ai">${AI_AVATAR_SVG}</div>
      <div class="msg-body">
        <div class="msg-head"><span class="author"><em>Atelier</em></span><span class="time">${nowStr()}</span></div>
        ${toolBadges.length ? `<div class="tools-row">${toolBadges.map(t => `<span class="tool-badge done"><span class="pulse"></span>${esc(t)}<svg class="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5L10 3.5"/></svg></span>`).join('')}</div>` : '<div class="tools-row"></div>'}
        <div class="msg-content">${html}</div>
        <div class="msg-actions">
          <button class="msg-action copy" onclick="copyMessage(this)" title="Antwort kopieren">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3.5C3 2.67 3.67 2 4.5 2H11"/></svg>
            <span>Kopieren</span>
          </button>
        </div>
      </div>`;
    msgList.appendChild(row);
    enhanceCodeBlocks(row);
  }

  function createAiRow() {
    ensureNoWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row msg-ai';
    row.innerHTML = `
      <div class="msg-avatar ai">${AI_AVATAR_SVG}</div>
      <div class="msg-body">
        <div class="msg-head"><span class="author"><em>Atelier</em></span><span class="time">${nowStr()}</span></div>
        <div class="tools-row"></div>
        <div class="msg-content"><span class="thinking">denke nach<span class="dots"><span></span><span></span><span></span></span></span></div>
        <div class="msg-actions">
          <button class="msg-action copy" onclick="copyMessage(this)" title="Antwort kopieren">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3.5C3 2.67 3.67 2 4.5 2H11"/></svg>
            <span>Kopieren</span>
          </button>
        </div>
      </div>`;
    msgList.appendChild(row);
    autoScroll = true;
    scrollBottomIfNeeded();
    return {
      row,
      tools: row.querySelector('.tools-row'),
      bub:   row.querySelector('.msg-content'),
      actions: row.querySelector('.msg-actions'),
    };
  }

  // Tool badges
  const activeBadges = {};
  const nameQueue = {};
  function toolStart(el, runId, name) {
    const b = document.createElement('span');
    b.className = 'tool-badge';
    b.innerHTML = `<span class="pulse"></span>${esc(name)}`;
    el.appendChild(b);
    if (runId) activeBadges[runId] = b;
    else (nameQueue[name] = nameQueue[name] || []).push(b);
    scrollBottomIfNeeded();
  }
  function toolDone(runId, name) {
    let b;
    if (runId && activeBadges[runId]) { b = activeBadges[runId]; delete activeBadges[runId]; }
    else if (nameQueue[name] && nameQueue[name].length) { b = nameQueue[name].shift(); }
    if (!b) return;
    b.classList.add('done');
    b.innerHTML = `<span class="pulse"></span>${esc(name)}<svg class="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5L10 3.5"/></svg>`;
  }
  function collectToolBadgeNames(el) {
    return Array.from(el.querySelectorAll('.tool-badge')).map(b => b.textContent.replace(/✓/g,'').trim());
  }

  function enhanceCodeBlocks(scope) {
    scope.querySelectorAll('pre').forEach(pre => {
      let btn = pre.querySelector('.copy-code');
      if (!btn) {
        btn = document.createElement('button');
        btn.className = 'copy-code';
        pre.appendChild(btn);
      }
      btn.textContent = 'kopieren';
      btn.classList.remove('copied');
      btn.onclick = () => {
        const code = pre.querySelector('code')?.innerText || pre.innerText;
        navigator.clipboard.writeText(code);
        btn.textContent = 'kopiert';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'kopieren'; btn.classList.remove('copied'); }, 1400);
      };
    });
  }

  function copyMessage(btn) {
    const content = btn.closest('.msg-body').querySelector('.msg-content');
    const text = content.innerText;
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      const span = btn.querySelector('span');
      const old = span.textContent;
      span.textContent = 'Kopiert';
      setTimeout(() => { btn.classList.remove('copied'); span.textContent = old; }, 1400);
    });
  }

  // ── Send / stream ───────────────────────────────────────────────────
  function setStreamingState(on) {
    streaming = on;
    sendBtn.classList.toggle('streaming', on);
    sendBtn.disabled = !activeInst;
    sendBtn.setAttribute('aria-label', on ? 'Generierung stoppen' : 'Senden');
    sendIcon.innerHTML = on
      ? '<rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" stroke="none"/>'
      : '<path d="M3 8h10M8 3l5 5-5 5"/>';
  }
  function onSendOrStop() { if (streaming) abortStream(); else sendMessage(); }
  function abortStream() {
    if (currentReader) { try { currentReader.cancel(); } catch {} }
    setStreamingState(false);
  }

  function collectMessagesForPersist() {
    const out = [];
    msgList.querySelectorAll('.msg-row').forEach(r => {
      if (r.classList.contains('msg-user')) {
        out.push({ role: 'user', content: r.querySelector('.msg-content').textContent });
      } else if (r.classList.contains('msg-ai')) {
        const tools = collectToolBadgeNames(r);
        out.push({ role: 'assistant', content: r.querySelector('.msg-content').innerHTML, tools });
      }
    });
    return out;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || streaming || !activeInst) return;
    setStreamingState(true);
    input.value = '';
    input.style.height = 'auto';
    for (const k of Object.keys(activeBadges)) delete activeBadges[k];
    for (const k of Object.keys(nameQueue))    delete nameQueue[k];

    appendUser(text);
    const isFirstUserMsg = msgList.querySelectorAll('.msg-user').length === 1;
    if (isFirstUserMsg) {
      const title = text.length > 60 ? text.slice(0, 58).trim() + '…' : text;
      persistCurrentChat(collectMessagesForPersist(), title);
    }

    const { row, tools: toolsEl, bub } = createAiRow();
    let raw = '', started = false, errored = false;

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId, instance_id: activeInst.id }),
      });
      if (!resp.ok) throw new Error(`Server-Fehler ${resp.status}`);
      currentReader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await currentReader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
          if (ev.type === 'token') {
            if (!started) { bub.innerHTML = ''; started = true; }
            raw += ev.content;
            bub.innerHTML = marked.parse(raw) + '<span class="stream-caret"></span>';
            enhanceCodeBlocks(bub);
            scrollBottomIfNeeded();
          } else if (ev.type === 'tool_start') {
            toolStart(toolsEl, ev.run_id, ev.name);
          } else if (ev.type === 'tool_end') {
            toolDone(ev.run_id, ev.name);
          } else if (ev.type === 'error') {
            errored = true;
            bub.innerHTML = '';
            const e = document.createElement('div');
            e.className = 'msg-error';
            e.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v3.5M8 11h0"/></svg><div><strong>Fehler:</strong> ${esc(ev.content)}</div>`;
            bub.appendChild(e);
          } else if (ev.type === 'done') {
            if (!started && !errored) bub.innerHTML = '<em style="color:var(--ink-4);font-style:italic;font-family:var(--font-display)">Keine Antwort.</em>';
          }
        }
      }
      // Remove caret
      bub.querySelector('.stream-caret')?.remove();
      enhanceCodeBlocks(bub);
    } catch (err) {
      bub.innerHTML = '';
      const e = document.createElement('div');
      e.className = 'msg-error';
      e.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v3.5M8 11h0"/></svg><div><strong>Verbindungsfehler:</strong> ${esc(err.message)}</div>`;
      bub.appendChild(e);
    } finally {
      bub.querySelector('.stream-caret')?.remove();
      enhanceCodeBlocks(bub);
      currentReader = null;
      setStreamingState(false);
      input.focus();
      persistCurrentChat(collectMessagesForPersist());
    }
  }

  // ── Settings modal ──────────────────────────────────────────────────
  function openSettings() {
    closeStart();
    cancelForm();
    renderList();
    document.getElementById('settings-overlay').classList.add('open');
  }
  function closeSettings() { document.getElementById('settings-overlay').classList.remove('open'); }

  function showForm(id) {
    editingId = id;
    const form = document.getElementById('inst-form');
    form.classList.add('visible');
    document.getElementById('form-heading').textContent = id ? 'Bearbeiten' : 'Neue Instanz';
    const i = id ? (instances.find(x => x.id === id) || {}) : {};
    document.getElementById('f-name').value                 = i.name || '';
    document.getElementById('f-directus-url').value         = i.directus_url || '';
    document.getElementById('f-token').value                = i.directus_token || '';
    document.getElementById('f-website-url').value          = i.website_url || '';
    document.getElementById('f-website-internal-url').value = i.website_internal_url || '';
    document.getElementById('f-email').value                = i.directus_email || '';
    document.getElementById('f-password').value             = i.directus_password || '';
    form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('f-name').focus();
  }
  function cancelForm() {
    editingId = null;
    document.getElementById('inst-form').classList.remove('visible');
  }
  async function saveInstance() {
    const body = {
      name:                  document.getElementById('f-name').value.trim(),
      directus_url:          document.getElementById('f-directus-url').value.trim(),
      directus_token:        document.getElementById('f-token').value.trim() || null,
      website_url:           document.getElementById('f-website-url').value.trim() || null,
      website_internal_url:  document.getElementById('f-website-internal-url').value.trim() || null,
      directus_email:        document.getElementById('f-email').value.trim() || null,
      directus_password:     document.getElementById('f-password').value || null,
    };
    if (!body.name || !body.directus_url) {
      toast('Name und Directus URL sind Pflichtfelder.', 'err');
      return;
    }
    const url = editingId ? `/instances/${editingId}` : '/instances';
    const res = await fetch(url, {
      method: editingId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { toast('Fehler beim Speichern.', 'err'); return; }
    await loadInstances();
    cancelForm();
    toast(editingId ? 'Instanz aktualisiert' : 'Instanz erstellt', 'ok');
  }
  async function deleteInst(id) {
    const ok = await confirmAsk('Instanz löschen?', 'Diese Aktion kann nicht rückgängig gemacht werden.', 'Löschen', true);
    if (!ok) return;
    await fetch(`/instances/${id}`, { method: 'DELETE' });
    if (activeInst?.id === id) {
      activeInst = null;
      updateChip();
      input.disabled = true;
      sendBtn.disabled = true;
      composer.classList.add('disabled');
      renderWelcome();
    }
    await loadInstances();
    renderHistory();
    toast('Instanz gelöscht', 'ok');
  }

  // ── Overlay click-outside ───────────────────────────────────────────
  function onOverlayClick(e, id) {
    if (e.target.id !== id) return;
    if (id === 'start-overlay') closeStart();
    else if (id === 'settings-overlay') closeSettings();
    else if (id === 'confirm-overlay') closeConfirm(false);
  }

  // ── Input behavior ──────────────────────────────────────────────────
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 220) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Global shortcuts
  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === 'n') { e.preventDefault(); newChat(); }
    if (mod && e.key === 'k') { e.preventDefault(); openStart(true); }
    if (mod && e.key === ',') { e.preventDefault(); openSettings(); }
    if (e.key === 'Escape') {
      ['start-overlay','settings-overlay','confirm-overlay'].forEach(id => {
        const el = document.getElementById(id);
        if (el.classList.contains('open')) {
          if (id === 'start-overlay') closeStart();
          else if (id === 'settings-overlay') closeSettings();
          else closeConfirm(false);
        }
      });
    }
  });

  // ── Init ────────────────────────────────────────────────────────────
  loadChats();
  loadInstances().then(() => {
    newChat();
    openStart(false);
  });
</script>
</body>
