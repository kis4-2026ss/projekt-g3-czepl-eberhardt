services:
  database:
    image: postgres:16-alpine
    container_name: directus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7-alpine
    container_name: directus-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    image: directus/directus:11.1.2
    container_name: directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      KEY: "5c5b7f4e-3a0e-4a3d-9b5e-2f3c6d8a1b22"
      SECRET: "9d7f1c2e-7b8a-4d3e-a5c6-1b2d3e4f5a67"
      ADMIN_EMAIL: "admin@gmail.at"
      ADMIN_PASSWORD: "admin"
      ADMIN_TOKEN: "adlerwirt-dev-token"
      PUBLIC_URL: "http://localhost:8055"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus"
      CACHE_STORE: "redis"
      CACHE_ENABLED: "false"
      REDIS: "redis://cache:6379"
      WEBSOCKETS_ENABLED: "true"

  website:
    image: node:22-alpine
    container_name: adlerwirt-website
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./website:/app
      - website_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    depends_on:
      - directus
    environment:
      DIRECTUS_URL: "http://directus:8055"
      DIRECTUS_TOKEN: "adlerwirt-dev-token"
      ADMIN_EMAIL: "admin@gmail.at"
      ADMIN_PASSWORD: "admin"
      MCP_SERVER_URL: "http://mcp-server:3001"
    command: sh /app/docker-start.sh

  mcp-server:
    build: ./mcp-server
    container_name: directus-mcp-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - directus
    environment:
      DIRECTUS_URL: "http://directus:8055"
      DIRECTUS_EMAIL: "admin@gmail.at"
      DIRECTUS_PASSWORD: "admin"
      PORT: "3001"
      WEBSITE_URL: "http://localhost:4321"

  seed:
    image: python:3.12-alpine
    container_name: directus-seed
    depends_on:
      - directus
    volumes:
      - ./seed:/seed:ro
    working_dir: /seed
    environment:
      DIRECTUS_URL: "http://directus:8055"
      ADMIN_EMAIL: "admin@gmail.at"
      ADMIN_PASSWORD: "admin"
      PYTHONUNBUFFERED: "1"
    command:
      - "sh"
      - "-c"
      - "pip install --quiet --no-cache-dir requests && python /seed/seed.py"
    restart: "no"

volumes:
  db_data:
  directus_uploads:
  website_node_modules:
